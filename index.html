<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Molecular Cloning Lab — Produksi Insulin Manusia (pUC19-INS)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bench-top: #182338;
    --bench-edge: #0d1422;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.22);
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0;
    background: #090e17;
    color: #f1f5f9;
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Realistic Lab Bench & Glassware */
  .lab-bench {
    position: relative;
    background: radial-gradient(circle at 50% 15%, #1e2d47 0%, #101827 72%, #0a0f1a 100%);
    border: 1px solid #2b3c59;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.65), 0 12px 32px rgba(0,0,0,0.5);
    border-radius: 18px;
    overflow: hidden;
  }
  .bench-counter {
    background: linear-gradient(180deg, #233148 0%, #162032 14%, #0e1522 100%);
    border-top: 2px solid #475d82;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.55);
  }

  /* Glass Vial & Liquid Meniscus */
  .glass-tube {
    position: relative;
    background: linear-gradient(90deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.14) 100%);
    border: 1.5px solid rgba(226, 232, 240, 0.45);
    box-shadow: inset -3px 0 6px rgba(255,255,255,0.12), 0 6px 14px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .liquid-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s;
  }
  .liquid-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.45);
    border-radius: 50%;
  }

  /* Ice Bucket Texture */
  .ice-bucket {
    background: linear-gradient(145deg, #1d4ed8, #1e3a8a);
    border: 2px solid #60a5fa;
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.25), 0 8px 20px rgba(0,0,0,0.5);
  }
  .ice-cubes {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(224,242,254,0.85) 0 10px, transparent 12px),
      radial-gradient(circle at 65% 25%, rgba(186,230,253,0.8) 0 12px, transparent 14px),
      radial-gradient(circle at 40% 70%, rgba(240,249,255,0.9) 0 11px, transparent 13px),
      radial-gradient(circle at 82% 68%, rgba(186,230,253,0.75) 0 10px, transparent 12px);
  }

  /* Interactive Tool Hover & Drag States */
  .draggable-item {
    cursor: grab;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .draggable-item:hover { transform: translateY(-3px); }
  .draggable-item:active { cursor: grabbing; transform: scale(0.97); }
  .drop-zone {
    transition: all 0.2s ease;
  }
  .drop-zone.highlight {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35), inset 0 0 24px rgba(56, 189, 248, 0.2) !important;
    transform: scale(1.02);
  }

  /* Animations */
  @keyframes vibrate {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-2px, 1px) rotate(-1.5deg); }
    50% { transform: translate(2px, -1px) rotate(1.5deg); }
    75% { transform: translate(-1px, -2px) rotate(-1deg); }
  }
  .vibrating { animation: vibrate 0.09s linear infinite; }

  @keyframes rotorSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .spinning-fast { animation: rotorSpin 0.18s linear infinite; }

  @keyframes flameFlicker {
    0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.95; }
    50% { transform: scaleY(1.12) scaleX(0.92); opacity: 1; }
  }
  .flame-anim { transform-origin: bottom center; animation: flameFlicker 0.22s ease-in-out infinite; }

  @keyframes bubbleRise {
    0% { transform: translateY(0) scale(0.7); opacity: 0.8; }
    100% { transform: translateY(-48px) scale(1.2); opacity: 0; }
  }
  .bubble { animation: bubbleRise 1.1s ease-in infinite; }

  @keyframes laminarFlow {
    0% { stroke-dashoffset: 24; }
    100% { stroke-dashoffset: 0; }
  }
  .airflow-line { stroke-dasharray: 6 6; animation: laminarFlow 0.7s linear infinite; }

  @keyframes tipDrop {
    0% { transform: translateY(-24px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(28px) rotate(55deg); opacity: 0; }
  }
  .eject-anim { animation: tipDrop 0.45s ease-in forwards; }

  /* Floating Cursor-Following Tool */
  #floating-tool {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-18px, -115px);
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65));
    transition: opacity 0.12s ease;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff !important; color: #000 !important; }
    .print-card { background: #fff !important; color: #000 !important; border: 1px solid #cbd5e1 !important; box-shadow: none !important; }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- FLOATING CURSOR TOOL (MICROPIPETTE / SPREADER / LOOP / SCALPEL) -->
<div id="floating-tool" class="hidden"></div>

<!-- TOP HUD -->
<header class="no-print sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-3 py-2.5">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-500 to-sky-600 flex items-center justify-center text-lg shadow-lg shadow-sky-500/20">🧬</div>
      <div>
        <div class="text-sm sm:text-base font-extrabold tracking-tight text-sky-300 leading-tight">MOLECULAR CLONING LAB</div>
        <div class="text-[11px] text-slate-400">Produksi Insulin Manusia (Vektor pUC19-INS)</div>
      </div>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <span id="hud-station" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-800 border border-slate-700 text-slate-200">Registrasi</span>
      <span id="hud-accuracy" class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-950/80 border border-emerald-600/50 text-emerald-300">Akurasi: 100%</span>
      <button onclick="toggleNotebook()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-300">📒 Log Lab (<span id="log-count">0</span>)</button>
      <button onclick="toggleSound()" id="btn-sound" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200">🔊 Audio</button>
    </div>
  </div>
  <div class="max-w-6xl mx-auto mt-2 h-1.5 bg-slate-800 rounded-full overflow-hidden">
    <div id="hud-progress" class="h-full bg-gradient-to-r from-teal-400 via-sky-400 to-indigo-400 transition-all duration-500" style="width: 0%"></div>
  </div>
</header>

<!-- LAB NOTEBOOK DRAWER -->
<div id="notebook-modal" class="no-print hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
      <h3 class="font-bold text-sky-300 text-base">📒 Catatan Laboratorium (Lab Notebook)</h3>
      <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white text-sm px-2 py-1 rounded bg-slate-800">Tutup ✕</button>
    </div>
    <div id="notebook-list" class="max-h-72 overflow-y-auto space-y-2 text-xs text-slate-300"></div>
  </div>
</div>

<!-- MAIN WORKSPACE -->
<main id="app" class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-4 pb-24"></main>

<!-- BOTTOM NAVIGATION -->
<nav id="bottom-nav" class="no-print fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-3 py-2.5 flex items-center justify-between gap-2">
  <div class="max-w-6xl mx-auto w-full flex items-center justify-between gap-2">
    <button id="btn-prev" onclick="prevStation()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 disabled:opacity-40">← Sebelumnya</button>
    <div id="active-tool-pill" class="text-xs text-center text-slate-400 font-medium truncate px-2">Tangan Kosong (Klik/Tarik Alat)</div>
    <button id="btn-next" onclick="nextStation()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-teal-500 to-sky-600 hover:from-teal-400 hover:to-sky-500 text-white shadow-lg shadow-sky-500/20 disabled:opacity-40">Lanjut →</button>
  </div>
</nav>

<script>
/* ============================================================================
   1. WEB AUDIO SYNTHESIZER (REALISTIC LAB SOUND EFFECTS)
   ============================================================================ */
let soundEnabled = true;
let audioCtx = null;

function playTone(freq, duration = 0.08, type = 'sine', gainVal = 0.12, slideTo = null) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

const SFX = {
  click: () => playTone(680, 0.045, 'triangle', 0.1),
  tipAttach: () => { playTone(520, 0.05, 'square', 0.08); setTimeout(() => playTone(880, 0.06, 'triangle', 0.1), 45); },
  aspirate: () => playTone(320, 0.16, 'sine', 0.12, 620),
  dispense: () => playTone(600, 0.15, 'sine', 0.12, 290),
  eject: () => {
    playTone(260, 0.07, 'sawtooth', 0.09, 140);
    setTimeout(() => playTone(190, 0.09, 'triangle', 0.09, 110), 80);
  },
  centrifuge: () => {
    for (let i = 0; i < 8; i++) {
      setTimeout(() => playTone(220 + i * 55, 0.09, 'triangle', 0.08), i * 95);
    }
  },
  vortex: () => {
    for (let i = 0; i < 6; i++) {
      setTimeout(() => playTone(160 + (i % 2) * 45, 0.06, 'sawtooth', 0.07), i * 65);
    }
  },
  bunsen: () => playTone(110, 0.32, 'sawtooth', 0.1, 75),
  spray: () => playTone(950, 0.14, 'sawtooth', 0.06, 400),
  success: () => {
    playTone(523.25, 0.09, 'triangle', 0.13);
    setTimeout(() => playTone(659.25, 0.09, 'triangle', 0.13), 95);
    setTimeout(() => playTone(783.99, 0.18, 'triangle', 0.14), 190);
  },
  alarm: () => {
    playTone(220, 0.16, 'sawtooth', 0.16);
    setTimeout(() => playTone(165, 0.22, 'sawtooth', 0.16), 165);
  }
};

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('btn-sound').textContent = soundEnabled ? '🔊 Audio' : '🔇 Mute';
}

/* ============================================================================
   2. GLOBAL STATE & TACTILE TOOL SYSTEM
   ============================================================================ */
const state = {
  station: 0, // 0 = Intro, 1..10 = Lab Stations, 11 = Final Certificate
  student: { name: '', classRoom: '', group: '' },
  errors: 0,
  completed: {},
  logs: [],
  toast: null,
  activeTool: null, // 'pipette' | 'spreader' | 'loop' | 'scalpel' | 'spray' | null
  dragType: null,
  // Station-specific states
  s1: { coat: false, gloves: false, goggles: false, uvOff: false, blower: false, sprayed: false, wiped: false },
  s2: { tubeInCentrifuge: false, spun: false, supRemoved: false, p1: false, p2: false, n3: false, eluted: false },
  s3: {
    vol: 5,
    hasTip: false,
    tipDirty: false,
    tipColor: 'transparent',
    lastSource: null,
    added: { buf: 0, puc: 0, ins: 0, eco: 0, hind: 0 },
    tubeInBath: false,
    digested: false
  },
  s4: { loaded: { M: false, V: false, I: false }, lidClosed: false, ran: false, uvOn: false, bandCut: false },
  s5: { added: { vec: false, ins: false, lig: false, buf: false }, vortexed: false, incubated: false },
  s6: { mixed: false, ice1: false, heatSec: 0, heatInterval: null, ice2: false, soc: false, recovered: false },
  s7: { dropped: false, alc: false, flamed: false, cooled: false, spreadPct: 0 },
  s8: { loopFlamed: false, pickedWhite: false, inoculated: false },
  s9: { added: { col: false, mmix: false, pri: false }, inCycler: false, cycle: 0, pcrInterval: null, done: false },
  s10: { iptg: false, sonicated: false, columnLoaded: false, eluted: false }
};

function setToast(type, text) {
  state.toast = { type, text };
  if (type === 'bad') {
    state.errors++;
    SFX.alarm();
  } else if (type === 'ok') {
    SFX.success();
  } else {
    SFX.click();
  }
  render();
}

function finishStation(num, summary) {
  if (!state.completed[num]) {
    state.completed[num] = true;
    state.logs.push({ station: num, text: summary });
  }
  state.activeTool = null;
  updateFloatingTool();
  setToast('ok', `Stasiun ${num} Selesai! ${summary}`);
}

function goStation(n) {
  if (state.s6.heatInterval) { clearInterval(state.s6.heatInterval); state.s6.heatInterval = null; }
  if (state.s9.pcrInterval) { clearInterval(state.s9.pcrInterval); state.s9.pcrInterval = null; }
  state.station = n;
  state.toast = null;
  state.activeTool = null;
  updateFloatingTool();
  SFX.click();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStation() { if (state.station > 0) goStation(state.station - 1); }
function nextStation() { if (state.station < 11) goStation(state.station + 1); }

function toggleNotebook() {
  const modal = document.getElementById('notebook-modal');
  const list = document.getElementById('notebook-list');
  modal.classList.toggle('hidden');
  list.innerHTML = state.logs.length
    ? state.logs.map(l => `<div class="p-2.5 rounded-lg bg-slate-950 border border-slate-800"><b class="text-teal-400">Stasiun ${l.station}:</b> ${l.text}</div>`).join('')
    : '<p class="text-slate-400 italic">Belum ada catatan eksperimen. Selesaikan stasiun pertama untuk mencatat hasil.</p>';
}

/* ============================================================================
   3. FLOATING CURSOR TOOL RENDERER & POINTER TRACKING
   ============================================================================ */
function selectTool(toolName) {
  state.activeTool = state.activeTool === toolName ? null : toolName;
  SFX.click();
  updateFloatingTool();
  render();
}

function updateFloatingTool() {
  const el = document.getElementById('floating-tool');
  const pill = document.getElementById('active-tool-pill');
  if (!state.activeTool) {
    el.classList.add('hidden');
    if (pill) pill.textContent = 'Tangan Kosong (Klik / Tarik Alat di Meja)';
    return;
  }
  el.classList.remove('hidden');

  if (state.activeTool === 'pipette') {
    const s = state.s3;
    if (pill) pill.textContent = `🔬 Mikropipet P20 (${s.vol} µL) — ${s.hasTip ? (s.tipDirty ? 'Tip Terisi Cairan' : 'Tip Steril') : 'Belum Pasang Tip'}`;
    el.innerHTML = `
      <svg width="46" height="125" viewBox="0 0 46 125">
        <rect x="17" y="2" width="12" height="10" rx="2" fill="#0ea5e9"/>
        <rect x="14" y="12" width="18" height="46" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
        <rect x="17" y="20" width="12" height="16" rx="2" fill="#0f172a"/>
        <text x="23" y="31" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">${s.vol}</text>
        <path d="M18 58 L28 58 L25 82 L21 82 Z" fill="#64748b"/>
        ${s.hasTip ? `
          <path d="M20 82 L26 82 L24 120 L22 120 Z" fill="rgba(254, 240, 138, 0.85)" stroke="#ca8a04" stroke-width="1"/>
          ${s.tipDirty ? `<path d="M21.2 102 L24.8 102 L24 120 L22 120 Z" fill="${s.tipColor}"/>` : ''}
        ` : ''}
      </svg>`;
  } else if (state.activeTool === 'scalpel') {
    if (pill) pill.textContent = '🔪 Scalpel Steril — Klik Pita DNA 333 bp di Gel UV';
    el.innerHTML = `<div class="text-3xl">🔪</div>`;
  } else if (state.activeTool === 'spreader') {
    if (pill) pill.textContent = '🏒 L-Spreader — Sterilkan & Usap Cawan Agar';
    el.innerHTML = `<div class="text-3xl">🏒</div>`;
  } else if (state.activeTool === 'loop') {
    if (pill) pill.textContent = '🥢 Jarum Ose — Bakar di Bunsen & Ambil Koloni Putih';
    el.innerHTML = `<div class="text-3xl">🥢</div>`;
  } else if (state.activeTool === 'spray') {
    if (pill) pill.textContent = '🧴 Botol Alkohol 70% — Semprot Meja Kabinet';
    el.innerHTML = `<div class="text-3xl">🧴</div>`;
  }
}

window.addEventListener('pointermove', (e) => {
  const el = document.getElementById('floating-tool');
  if (el && !el.classList.contains('hidden')) {
    el.style.left = e.clientX + 'px';
    el.style.top = e.clientY + 'px';
  }
});

/* ============================================================================
   4. DRAG & DROP HELPERS (HTML5 + TOUCH FALLBACK)
   ============================================================================ */
function startDrag(type) {
  state.dragType = type;
  SFX.click();
}
function allowDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.add('highlight');
}
function leaveDrop(e) {
  e.currentTarget.classList.remove('highlight');
}
function handleDrop(e, target) {
  e.preventDefault();
  e.currentTarget.classList.remove('highlight');
  const d = state.dragType;
  state.dragType = null;
  if (!d) return;
  processDropAction(d, target);
}

function processDropAction(item, target) {
  if (state.station === 1 && target === 'avatar') {
    equipS1(item);
  } else if (state.station === 2 && item === 'lysate-tube' && target === 'centrifuge') {
    state.s2.tubeInCentrifuge = true;
    SFX.click();
    render();
  } else if (state.station === 3 && item === 'rxn-tube' && target === 'waterbath37') {
    placeTubeInBath37();
  }
}

/* ============================================================================
   5. MASTER RENDER ENGINE
   ============================================================================ */
function render() {
  const acc = Math.max(0, 100 - state.errors * 3);
  document.getElementById('hud-station').textContent =
    state.station === 0 ? 'Registrasi' : (state.station === 11 ? 'Sertifikat Akhir' : `Stasiun ${state.station} / 10`);
  document.getElementById('hud-accuracy').textContent = `Akurasi: ${acc}%`;
  document.getElementById('log-count').textContent = state.logs.length;
  document.getElementById('hud-progress').style.width = `${Math.min(state.station, 10) * 10}%`;

  const nav = document.getElementById('bottom-nav');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const app = document.getElementById('app');

  if (state.station === 0) {
    nav.classList.add('hidden');
    app.innerHTML = renderIntro();
    validateStart();
    return;
  }

  if (state.station === 11) {
    nav.classList.add('hidden');
    app.innerHTML = renderCertificate(acc);
    return;
  }

  nav.classList.remove('hidden');
  btnPrev.disabled = state.station <= 1;
  btnNext.disabled = !state.completed[state.station];
  btnNext.textContent = state.station === 10 ? 'Lihat Sertifikat & Laporan 🏆' : `Lanjut Stasiun ${state.station + 1} →`;

  const renderers = [
    null,
    renderStation1,
    renderStation2,
    renderStation3,
    renderStation4,
    renderStation5,
    renderStation6,
    renderStation7,
    renderStation8,
    renderStation9,
    renderStation10
  ];

  const toastHtml = state.toast ? `
    <div class="mt-3 p-3.5 rounded-xl border text-xs sm:text-sm font-semibold flex items-start gap-2.5 ${
      state.toast.type === 'ok' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
      state.toast.type === 'bad' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
      'bg-sky-950/90 border-sky-500 text-sky-200'
    }">
      <span class="text-base">${state.toast.type === 'ok' ? '✅' : (state.toast.type === 'bad' ? '🚨' : 'ℹ️')}</span>
      <span>${state.toast.text}</span>
    </div>` : '';

  app.innerHTML = renderers[state.station]() + toastHtml;
  updateFloatingTool();
}

/* ============================================================================
   6. STATION 0: BRIEFING & STUDENT REGISTRATION
   ============================================================================ */
function renderIntro() {
  return `
    <div class="max-w-2xl mx-auto mt-2 bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-7 shadow-2xl">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-300 text-xs font-bold mb-3">
        <span>🔬 VIRTUAL WET-LAB SIMULATOR</span> • <span>10 STASIUN LENGKAP</span>
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-white mb-2">Rekayasa Genetika: Kloning & Produksi Insulin Manusia (<span class="text-teal-400">pUC19-INS</span>)</h1>

function equipS1(part) {
  state.s1[part] = true;
  SFX.click();
  checkS1Complete();

}
function toggleUVS1() {
  state.s1.uvOff = true;
  SFX.click();
  checkS1Complete();
  render();
}
function toggleBlowerS1() {
  if (!state.s1.uvOff) return setToast('bad', 'Matikan lampu UV terlebih dahulu sebelum menyalakan blower dan membuka kaca kabinet!');
  state.s1.blower = true;
  SFX.click();
  checkS1Complete();
  render();
}
function sprayAlcoholS1() {
  const s = state.s1;
  if (!s.gloves) return setToast('bad', 'Kenakan sarung tangan nitril terlebih dahulu sebelum menyentuh botol alkohol & kabinet!');
  if (!s.blower) return setToast('bad', 'Nyalakan blower Laminar Air Flow terlebih dahulu agar aliran udara steril aktif!');
  s.sprayed = true;
  SFX.spray();
  setToast('info', 'Alkohol 70% disemprotkan! Klik permukaan meja stainless steel di dalam kabinet untuk mengelapnya.');
}
function wipeCabinet() {
  if (!state.s1.sprayed) return;
  state.s1.wiped = true;
  SFX.click();
  checkS1Complete();
  render();
}
function checkS1Complete() {
  const s = state.s1;
  if (s.coat && s.gloves && s.goggles && s.uvOff && s.blower && s.wiped) {
    finishStation(1, 'APD lengkap terpasang dan meja Biosafety Cabinet telah disterilkan dengan alkohol 70%.');
  }
}

function putTubeCentrifuge() {
  if (!state.s2.tubeInCentrifuge) {
    state.s2.tubeInCentrifuge = true;
    SFX.click();
    render();
  }
}
function spinCentrifuge() {
  const r = document.getElementById('rotor-icon');
  if (r) r.classList.add('spinning-fast');
  SFX.centrifuge();
  setTimeout(() => {
    state.s2.spun = true;
    setToast('info', 'Sentrifugasi selesai! Pelet sel E. coli mengendap di dasar tabung. Lanjutkan buang supernatan.');
  }, 850);
}
function stepS2(step) {
  const s = state.s2;
  if (step === 'sup') { s.supRemoved = true; SFX.dispense(); render(); }
  if (step === 'p1') { s.p1 = true; SFX.aspirate(); render(); }
  if (step === 'p2') { s.p2 = true; SFX.aspirate(); render(); }
  if (step === 'n3') { s.n3 = true; SFX.aspirate(); render(); }
  if (step === 'elute') {
    s.eluted = true;
    finishStation(2, 'DNA plasmid pUC19 murni berhasil diisolasi melalui metode Alkaline Lysis Miniprep.');
  }
}

function adjustPipette(delta) {
  state.s3.vol = Math.max(1, Math.min(20, state.s3.vol + delta));
  state.activeTool = 'pipette';
  SFX.click();
  updateFloatingTool();
  render();
}
function attachSterileTip() {
  state.activeTool = 'pipette';
  state.s3.hasTip = true;
  state.s3.tipDirty = false;
  state.s3.tipColor = 'transparent';
  state.s3.lastSource = null;
  SFX.tipAttach();
  updateFloatingTool();
  render();
}
function ejectTipToBin() {
  if (!state.s3.hasTip) return;
  state.s3.hasTip = false;
  state.s3.tipDirty = false;
  state.s3.tipColor = 'transparent';
  state.s3.lastSource = null;
  SFX.eject();
  updateFloatingTool();
  render();
}
function aspirateReagent(key, name, reqVol, color) {
  const s = state.s3;
  state.activeTool = 'pipette';
  if (!s.hasTip) return setToast('bad', 'Pasang Tip Steril dari kotak kuning terlebih dahulu sebelum menyedot reagen!');
  if (s.tipDirty && s.lastSource !== key) {
    return setToast('bad', `KONTAMINASI SILANG! Tip masih bekas ${s.lastSource}. Buang tip ke Biohazard Bin dan pasang tip baru!`);
  }
  if (s.vol !== reqVol) {
    return setToast('bad', `Volume dial mikropipet masih ${s.vol} µL. Atur dial menjadi ${reqVol} µL untuk mengambil ${name}!`);
  }
  if (s.added[key] === reqVol) {
    return setToast('info', `${name} (${reqVol} µL) sudah masuk ke tabung reaksi.`);
  }
  s.tipDirty = true;
  s.tipColor = color;
  s.lastSource = key;
  s.pendingReagent = { key, name, reqVol };
  SFX.aspirate();
  setToast('info', `Berhasil menyedot ${reqVol} µL ${name}. Sekarang klik Tabung Reaksi Digest untuk menyuntikkannya!`);
}
function dispenseIntoReactionTube() {
  const s = state.s3;
  if (!s.pendingReagent) {
    return setToast('info', 'Sedot reagen dari Ice Bucket terlebih dahulu menggunakan mikropipet.');
  }
  const { key, name, reqVol } = s.pendingReagent;
  s.added[key] = reqVol;
  s.pendingReagent = null;
  SFX.dispense();
  setToast('info', `${reqVol} µL ${name} disuntikkan ke tabung! Jangan lupa buang tip bekas sebelum mengambil reagen lain.`);
}
function placeTubeInBath37() {
  const s = state.s3;
  const ready = s.added.buf === 2 && s.added.puc === 5 && s.added.ins === 5 && s.added.eco === 1 && s.added.hind === 1;
  if (!ready) return setToast('bad', 'Campuran reaksi belum lengkap 14 µL!');
  s.digested = true;
  finishStation(3, 'Plasmid pUC19 dan gen insulin berhasil dipotong dengan EcoRI & HindIII membentuk ujung lengket (sticky ends).');
}

function renderStation6() {
  const s = state.s6;
  return `

function s6Step(step) {
  const s = state.s6;
  if (step === 'mix') { s.mixed = true; SFX.dispense(); render(); }
  if (step === 'ice1') { s.ice1 = true; SFX.click(); setToast('info', 'Ion Ca²⁺ menempelkan plasmid pUC19-INS ke permukaan membran E. coli.'); }
  if (step === 'ice2') { s.ice2 = true; SFX.click(); setToast('info', 'Suhu dingin 0°C menutup kembali pori membran sel sehingga plasmid terperangkap di dalam bakteri.'); }
  if (step === 'soc') { s.soc = true; SFX.dispense(); render(); }
  if (step === 'rec') {
    s.recovered = true;
    finishStation(6, 'Transformasi Heat Shock berhasil; E. coli mulai mengekspresikan protein resistensi ampisilin (AmpR).');
  }
}
function startHeatShock() {
  state.s6.heatSec = 0;
  state.s6.heatInterval = setInterval(() => {
    state.s6.heatSec += 5;
    playTone(840, 0.035, 'sine', 0.06);
    if (state.s6.heatSec > 55) {
      clearInterval(state.s6.heatInterval);
      state.s6.heatInterval = null;
      state.s6.heatSec = 0;
      setToast('bad', 'TERLALU LAMA (>55 detik)! Panas berlebih merusak membran dan membunuh sel E. coli. Ulangi Heat Shock (target 40–50 detik)!');
    } else {
      render();
    }
  }, 500);
  render();
}
function stopHeatShock() {
  clearInterval(state.s6.heatInterval);
  state.s6.heatInterval = null;
  if (state.s6.heatSec < 40) {
    state.s6.heatSec = 0;
    return setToast('bad', 'Terlalu cepat (<40 detik)! Pori membran sel belum terbuka sempurna. Ulangi hingga 40–50 detik!');
  }
  setToast('info', `Tepat waktu (${state.s6.heatSec} detik)! Segera pindahkan tabung kembali ke Ice Bucket (langkah 4).`);
}

      <div class="border-l-4 border-sky-400 bg-slate-950/70 p-3 rounded-r-xl mb-4">
        <h2 class="text-sm sm:text-base font-bold text-sky-300">Stasiun 7/10 — Penanaman Bakteri (Spread Plate Method)</h2>
        <p class="text-xs text-slate-300 mt-0.5">Media: <b>LB Agar + Ampisilin + X-Gal + IPTG</b>.<br>1. Teteskan suspensi bakteri ke tengah cawan → 2. Celup <b>L-Spreader</b> ke Alkohol → 3. Bakar di <b>Api Bunsen</b> → 4. Dinginkan → 5. <b>Usap/gerakkan kursor atau jari memutar di atas agar</b> hingga 100% rata!</p>
      </div>

      <div class="lab-bench p-4">
        <div class="grid md:grid-cols-2 gap-4 items-center">
          <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2">
            <button onclick="s7Act('drop')" ${s.dropped ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">
              ${s.dropped ? '✔ 1. Suspensi Bakteri Diteteskan' : '💧 1. Teteskan 100 µL Bakteri'}
            </button>
            <button onclick="s7Act('alc')" ${!s.dropped || s.alc ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">
              ${s.alc ? '✔ 2. Spreader Dicelup Alkohol' : '🧴 2. Celup L-Spreader ke Alkohol'}
            </button>
            <button onclick="s7Act('flame')" ${!s.alc || s.flamed ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-amber-600 text-slate-950 text-left disabled:opacity-40">
              ${s.flamed ? '✔ 3. Dibakar di Api Bunsen' : '🔥 3. Bakar Spreader di Bunsen'}
            </button>
            <button onclick="s7Act('cool')" ${!s.flamed || s.cooled ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">
              ${s.cooled ? '✔ 4. Spreader Sudah Dingin' : '❄️ 4. Dinginkan di Tepi Agar'}
            </button>
            <div class="text-center pt-1">
              <span class="text-xl ${s.flamed ? 'flame-anim inline-block' : 'opacity-30'}">🔥</span>
              <span class="text-[11px] text-slate-400 ml-1">Pembakar Bunsen</span>
            </div>
          </div>

          <!-- Petri Dish Agar -->
          <div class="flex flex-col items-center">
            <div onpointermove="spreadBacteria()" onpointerdown="spreadBacteria()"
                 style="touch-action:none"
                 class="relative w-56 h-56 rounded-full bg-gradient-to-br from-amber-100 to-amber-200 border-8 border-slate-400 shadow-2xl flex items-center justify-center overflow-hidden cursor-crosshair">
              ${s.dropped ? `
                <div style="inset:${Math.max(8, 42 - s.spreadPct * 0.34)}%"
                     class="absolute rounded-full bg-white/75 transition-all duration-150"></div>` : ''}
              <div class="relative z-10 text-center px-4 text-amber-950 font-extrabold text-xs">
                ${!s.cooled ? 'Selesaikan langkah 1–4 terlebih dahulu' : `Usap permukaan agar!<br><span class="text-base">${Math.min(100, s.spreadPct)}%</span>`}
              </div>
            </div>
            <span class="text-[11px] text-slate-400 mt-2">Cawan Petri: LB Agar + Ampisilin + X-Gal + IPTG</span>
          </div>
        </div>
      </div>
    </div>`;
}
function s7Act(step) {
  const s = state.s7;
  if (step === 'drop') { s.dropped = true; SFX.dispense(); render(); }
  if (step === 'alc') { s.alc = true; state.activeTool = 'spreader'; SFX.click(); updateFloatingTool(); render(); }
  if (step === 'flame') { s.flamed = true; SFX.bunsen(); setToast('info', 'Alkohol terbakar habis mensterilkan batang L-spreader. Jangan lupa dinginkan sebelum menyentuh bakteri!'); }
  if (step === 'cool') { s.cooled = true; SFX.click(); setToast('info', 'Spreader sudah dingin! Sekarang usap/geser kursor atau jari memutar di atas cawan agar.'); }
}
function spreadBacteria() {
  const s = state.s7;
  if (!s.cooled || s.spreadPct >= 100) return;
  s.spreadPct += 6;
  if (s.spreadPct % 18 === 0) playTone(520 + s.spreadPct * 2, 0.03, 'sine', 0.05);
  if (s.spreadPct >= 100) {
    s.spreadPct = 100;
    finishStation(7, 'Bakteri transforman tersebar merata di permukaan media selektif LB + Ampisilin + X-Gal + IPTG.');
  } else {
    render();
  }
}

/* ============================================================================
   14. STATION 8: BLUE-WHITE SCREENING & LIQUID CULTURE INOCULATION
   ============================================================================ */
function renderStation8() {
  const s = state.s8;
  const colonies = [
    { x: 28, y: 34, white: false },
    { x: 66, y: 28, white: true },
    { x: 48, y: 52, white: false },
    { x: 72, y: 64, white: true },
    { x: 30, y: 68, white: true },
    { x: 54, y: 78, white: false }
  ];
  return `
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="border-l-4 border-sky-400 bg-slate-950/70 p-3 rounded-r-xl mb-4">
        <h2 class="text-sm sm:text-base font-bold text-sky-300">Stasiun 8/10 — Seleksi Koloni Biru-Putih (Blue-White Screening)</h2>
        <p class="text-xs text-slate-300 mt-0.5">1. Sterilkan <b>Jarum Ose</b> di api Bunsen.<br>2. Klik <b>KOLONI PUTIH</b> (sisipan gen insulin memutus gen <i>lacZα</i> sehingga tidak membentuk warna biru).<br>3. Celupkan koloni putih ke <b>Tabung Media Cair LB + Ampisilin</b> untuk diperbanyak.</p>
      </div>

      <div class="lab-bench p-4">
        <div class="flex flex-wrap justify-center gap-3 mb-4">
          <button onclick="flameLoopS8()" ${s.loopFlamed ? 'disabled' : ''} class="px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-40">
            ${s.loopFlamed ? '✔ 1. Jarum Ose Steril' : '🔥 1. Sterilkan Jarum Ose'}
          </button>
          <button onclick="inoculateBrothS8()" ${!s.pickedWhite || s.inoculated ? 'disabled' : ''} class="px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-teal-500 to-sky-600 text-white disabled:opacity-40">
            ${s.inoculated ? '✔ 3. Diinokulasi ke LB+Amp' : '🧪 3. Celup ke Media Cair LB+Amp'}
          </button>
        </div>

        <div class="relative w-56 h-56 mx-auto rounded-full bg-gradient-to-br from-amber-100 to-amber-200 border-8 border-slate-400 shadow-2xl">
          ${colonies.map(c => `
            <div onclick="pickColonyS8(${c.white})"
                 style="left:${c.x}%; top:${c.y}%"
                 class="absolute -translate-x-1/2 -translate-y-1/2 w-5 h-5 rounded-full border-2 border-slate-600 cursor-pointer transition hover:scale-125 ${
                   c.white ? 'bg-white shadow-md' : 'bg-blue-600'
                 } ${c.white && s.pickedWhite ? 'ring-4 ring-rose-500' : ''}"></div>`).join('')}
        </div>

        <div class="flex justify-center gap-4 text-xs mt-3">
          <span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded-full bg-white inline-block border border-slate-400"></i> Koloni Putih = Rekombinan (pUC19-INS)</span>
          <span class="flex items-center gap-1.5"><i class="w-3 h-3 rounded-full bg-blue-600 inline-block"></i> Koloni Biru = Non-Rekombinan</span>
        </div>
      </div>
    </div>`;
}
function flameLoopS8() {
  state.s8.loopFlamed = true;
  state.activeTool = 'loop';
  SFX.bunsen();
  updateFloatingTool();
  setToast('info', 'Jarum ose steril! Sekarang sentuh satu koloni PUTIH pada cawan agar.');
}
function pickColonyS8(isWhite) {
  if (!state.s8.loopFlamed) return setToast('bad', 'Sterilkan jarum ose di api Bunsen terlebih dahulu sebelum menyentuh koloni!');
  if (!isWhite) return setToast('bad', 'Itu koloni BIRU! Enzim β-galaktosidase masih utuh artinya plasmid tidak membawa gen insulin. Pilih koloni PUTIH!');
  state.s8.pickedWhite = true;
  SFX.click();
  setToast('info', 'Koloni putih rekombinan berhasil diambil! Klik tombol "Celup ke Media Cair LB+Amp".');
}
function inoculateBrothS8() {
  state.s8.inoculated = true;
  finishStation(8, 'Koloni putih pembawa plasmid rekombinan pUC19-INS berhasil diinokulasikan ke kultur cair LB + Ampisilin.');
}

/* ============================================================================
   15. STATION 9: COLONY PCR VERIFICATION (THERMAL CYCLER)
   ============================================================================ */
function renderStation9() {
  const s = state.s9;
  const ready = s.added.col && s.added.mmix && s.added.pri;
  return `
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="border-l-4 border-sky-400 bg-slate-950/70 p-3 rounded-r-xl mb-4">
        <h2 class="text-sm sm:text-base font-bold text-sky-300">Stasiun 9/10 — Konfirmasi PCR Koloni (Thermal Cycler)</h2>
        <p class="text-xs text-slate-300 mt-0.5">Verifikasi keberadaan sisipan gen insulin <b>333 bp</b>: Masukkan <b>Template Koloni Putih</b>, <b>Taq PCR Master Mix</b>, dan <b>Primer Spesifik Insulin</b> lalu jalankan 30 siklus PCR (95°C → 55°C → 72°C).</p>
      </div>

      <div class="lab-bench p-4">
        <div class="grid md:grid-cols-2 gap-4 items-center">
          <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2">
            <div class="text-[11px] font-bold text-slate-400 text-center">REAGEN PCR TUBE (0.2 mL)</div>
            <button onclick="addPCR('col')" ${s.added.col ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">${s.added.col ? '✔ Template Koloni Putih' : '🦠 + Template Koloni Putih'}</button>
            <button onclick="addPCR('mmix')" ${s.added.mmix ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">${s.added.mmix ? '✔ Taq PCR Master Mix' : '🧪 + Taq PCR Master Mix'}</button>
            <button onclick="addPCR('pri')" ${s.added.pri ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">${s.added.pri ? '✔ Primer Spesifik Insulin' : '🧬 + Primer Forward & Reverse'}</button>
          </div>

          <div class="bg-slate-900 border-2 ${s.pcrInterval ? 'border-sky-400' : 'border-slate-700'} rounded-2xl p-4 text-center">
            <div class="text-xs font-extrabold text-slate-300 mb-2">🌡️ PCR THERMAL CYCLER</div>
            <div class="mono text-xs bg-black text-emerald-400 py-3 px-2 rounded-xl border border-slate-800 mb-3">
              ${s.done ? '30/30 SIKLUS SELESAI • AMPLI-333 BP VALID' : (s.pcrInterval ? `RUNNING SIKLUS ${s.cycle}/30 (95°→55°→72°C)` : 'READY • 95°C / 55°C / 72°C')}
            </div>
            <button onclick="runColonyPCR()" ${!ready || s.done || s.pcrInterval ? 'disabled' : ''}
                    class="w-full py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-teal-500 to-sky-600 text-white disabled:opacity-40">
              ${s.done ? '✔ Amplikon 333 bp Terkonfirmasi' : 'Jalankan 30 Siklus PCR'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
}
function addPCR(k) { state.s9.added[k] = true; SFX.dispense(); render(); }
function runColonyPCR() {
  state.s9.cycle = 0;
  state.s9.pcrInterval = setInterval(() => {
    state.s9.cycle += 6;
    playTone(600 + state.s9.cycle * 8, 0.04, 'triangle', 0.07);
    if (state.s9.cycle >= 30) {
      clearInterval(state.s9.pcrInterval);
      state.s9.pcrInterval = null;
      state.s9.done = true;
      finishStation(9, 'Amplifikasi PCR koloni menghasilkan pita spesifik 333 bp yang mengonfirmasi gen insulin manusia.');
    } else {
      render();
    }
  }, 320);
  render();
}

/* ============================================================================
   16. STATION 10: PROTEIN EXPRESSION & INSULIN HARVESTING
   ============================================================================ */
function renderStation10() {
  const s = state.s10;
  return `
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="border-l-4 border-sky-400 bg-slate-950/70 p-3 rounded-r-xl mb-4">
        <h2 class="text-sm sm:text-base font-bold text-sky-300">Stasiun 10/10 — Induksi Ekspresi Protein & Panen Insulin Murni</h2>
        <p class="text-xs text-slate-300 mt-0.5">1. Tambahkan penginduksi <b>IPTG</b> agar promoter <i>lac</i> mengaktifkan transkripsi & translasi protein insulin.<br>2. Pecahkan dinding sel bakteri dengan <b>Sonikator Ultrasonik</b>.<br>3. Murnikan protein insulin lewat <b>Kolom Kromatografi Afinitas</b>.</p>
      </div>

      <div class="lab-bench p-4">
        <div class="grid md:grid-cols-2 gap-4 items-center">
          <div class="flex flex-col items-center">
            <div class="glass-tube w-16 h-32 rounded-b-2xl">
              <div class="liquid-fill" style="height:80%; background:${s.eluted ? '#38bdf8' : (s.iptg ? '#22c55e' : '#eab308')}"></div>
            </div>
            <span class="text-xs font-extrabold mt-2 ${s.eluted ? 'text-sky-300' : 'text-slate-200'}">
              ${s.eluted ? '💉 Hormon Insulin Manusia Murni' : (s.sonicated ? 'Lisat Protein Terlarut' : (s.iptg ? 'Kultur Mengekspresikan Insulin' : 'Kultur E. coli pUC19-INS'))}
            </span>
          </div>

          <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 space-y-2.5">
            <button onclick="s10Step('iptg')" ${s.iptg ? 'disabled' : ''} class="w-full py-2.5 px-3 rounded-xl text-xs font-bold bg-slate-800 border border-slate-600 text-left disabled:opacity-40">
              ${s.iptg ? '✔ 1. Diinduksi dengan IPTG' : '💧 1. Tambahkan Penginduksi IPTG'}
            </button>
            <button onclick="s10Step('son')" ${!s.iptg || s.sonicated ? 'disabled' : ''} class="w-full py-2.5 px-3 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 text-left disabled:opacity-40">
              ${s.sonicated ? '✔ 2. Sel Dilisiskan (Sonikasi)' : '🔊 2. Sonikasi (Pecah Dinding Sel)'}
            </button>
            <button onclick="s10Step('elute')" ${!s.sonicated || s.eluted ? 'disabled' : ''} class="w-full py-2.5 px-3 rounded-xl text-xs font-bold bg-gradient-to-r from-teal-500 to-sky-600 text-white text-left disabled:opacity-40">
              ${s.eluted ? '✔ 3. Insulin Murni Dipanen' : '🧬 3. Kromatografi Afinitas (Panen)'}
            </button>
          </div>
        </div>
      </div>
    </div>`;
}
function s10Step(step) {
  const s = state.s10;
  if (step === 'iptg') {
    s.iptg = true;
    SFX.dispense();
    setToast('info', 'IPTG mengikat represor lac sehingga RNA polimerase mentranskripsi gen insulin dan ribosom menyintesis polipeptida insulin!');
  }
  if (step === 'son') {
    s.sonicated = true;
    SFX.vortex();
    setToast('info', 'Gelombang ultrasonik memecahkan membran sel E. coli dan melepaskan protein insulin ke dalam larutan.');
  }
  if (step === 'elute') {
    s.eluted = true;
    finishStation(10, 'Hormon insulin manusia rekombinan berhasil dimurnikan dan siap digunakan!');
  }
}

/* ============================================================================
   17. STATION 11: FINAL LAB REPORT & CERTIFICATE
   ============================================================================ */
function renderCertificate(acc) {
  return `
    <div class="print-card max-w-3xl mx-auto mt-2 bg-slate-900 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl">

        <div>
          <span class="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-bold">PRAKTIKUM SELESAI • 10/10 STASIUN</span>
          <h1 class="text-xl sm:text-2xl font-extrabold text-white mt-2">Sertifikat & Laporan Praktikum Rekayasa Genetika</h1>

        <tr class="border-b border-slate-800"><td class="py-2 text-slate-400">Transformasi & Seleksi</td><td class="py-2 font-semibold">E. coli Heat Shock 42°C (45 dtk) • LB + Ampisilin + X-Gal/IPTG</td></tr>
        <tr class="border-b border-slate-800"><td class="py-2 text-slate-400">Verifikasi & Panen</td><td class="py-2 font-semibold">Amplikon PCR 333 bp Valid • Induksi IPTG & Kromatografi Afinitas</td></tr>
        <tr><td class="py-2 text-slate-400">Catatan Peringatan Prosedur</td><td class="py-2 font-semibold">${state.errors} kali peringatan teknis</td></tr>
      </table>

      <h3 class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-2">Log Aktivitas Meja Kerja (10 Stasiun)</h3>
      <div class="space-y-1.5 text-xs text-slate-300 mb-6">
        ${state.logs.map(l => `<div class="p-2 rounded-lg bg-slate-950/70 border border-slate-800"><b class="text-teal-400">Stasiun ${l.station}:</b> ${l.text}</div>`).join('')}
      </div>

      <div class="no-print flex flex-wrap gap-3">
        <button onclick="window.print()" class="flex-1 py-3 px-4 rounded-xl font-bold text-xs sm:text-sm bg-gradient-to-r from-teal-500 to-sky-600 text-white shadow-lg">
          🖨️ Cetak / Simpan Laporan PDF
        </button>
        <button onclick="prevStation()" class="py-3 px-4 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 border border-slate-700 text-slate-200">
          ← Kembali ke Stasiun 10
        </button>
        <button onclick="location.reload()" class="py-3 px-4 rounded-xl font-bold text-xs sm:text-sm bg-slate-800 border border-slate-700 text-slate-200">
          🔄 Mulai Praktikum Baru
        </button>
      </div>

}

render();
</script>
</body>
