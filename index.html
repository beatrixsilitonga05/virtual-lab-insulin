<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Virtual Lab Insulin</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;background:#0b1320;color:#f1f5f9;font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#0f172a;border-bottom:1px solid #334155;padding:10px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700}
.bdg{background:#1e293b;border:1px solid #475569;padding:3px 9px;border-radius:99px;font-size:.8rem}
.bar{height:6px;background:#1e293b;border-radius:9px;margin-top:8px}.bar i{display:block;height:100%;background:#14b8a6;border-radius:9px;transition:.3s}
main{max-width:720px;margin:0 auto;padding:12px 12px 84px}.card{background:#131f33;border:1px solid #2d4366;border-radius:14px;padding:14px}
.sop{background:#0f1c2e;border-left:4px solid #0ea5e9;padding:9px 12px;border-radius:8px;margin-bottom:12px}
.sop h3{margin:0 0 4px;color:#38bdf8;font-size:1rem}.sop p{margin:0;font-size:.88rem;color:#cbd5e1}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;margin:4px 0}
button:disabled{opacity:.4;cursor:not-allowed}.bp{background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:#fff;width:100%}
.bo{background:#1e293b;color:#f1f5f9;border:1px solid #475569;width:100%;text-align:left}.bo.ok{border-color:#22c55e;background:#14532d66}
.bw{background:#f59e0b;color:#0f172a;width:100%}.bd{background:#ef4444;color:#fff;width:100%}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font:inherit;margin:4px 0 10px}
.bench{background:#0f172a;border:2px solid #334155;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
.lcd{background:#020617;color:#22c55e;font-family:monospace;padding:6px;border-radius:6px;border:1px solid #334155;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pip{display:flex;align-items:center;justify-content:space-between;background:#0f172a;padding:8px;border-radius:10px;border:1px solid #334155;margin-bottom:8px}
.petri{position:relative;width:210px;height:210px;margin:8px auto;border-radius:50%;background:#fde68a;border:5px solid #94a3b8;touch-action:none;overflow:hidden}
.col{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid #0004;cursor:pointer}
.msg{padding:10px;border-radius:10px;margin-top:10px;font-weight:600}.msg.ok{background:#14532d;color:#dcfce7}.msg.bad{background:#7f1d1d;color:#fee2e2}.msg.in{background:#1e3a8a;color:#dbeafe}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f172a;border-top:1px solid #334155;padding:10px;display:flex;gap:8px}
nav button{margin:0;flex:1;text-align:center}table{width:100%;border-collapse:collapse;font-size:.88rem}td{padding:6px;border-bottom:1px solid #334155}
@media print{header,nav,.np{display:none}body{background:#fff;color:#000}.card{border:1px solid #ccc;background:#fff}}
</style></head>
<body>
<header class="np"><div class="top"><span style="color:#38bdf8">🧬 VIRTUAL LAB INSULIN</span><div><span class="bdg" id="hs">Registrasi</span> <span class="bdg" id="ha">Akurasi 100%</span></div></div><div class="bar"><i id="hb" style="width:0%"></i></div></header>
<main id="app"></main><nav class="np" id="nav"></nav>
<script>
const S={st:0,u:{n:'',k:'',g:''},err:0,done:{},m:null,log:[],
 s1:{a:0,b:0,c:0,d:0,e:0},s2:{a:0,b:0,c:0,d:0},s3:{v:5,t:0,c:0,lr:'',buf:0,puc:0,ins:0,eco:0,hin:0,ok:0},
 s4:{m:0,v:0,i:0,w:0,r:0,uv:0,cut:0},s5:{a:0,b:0,c:0,d:0,v:0,ok:0},s6:{a:0,b:0,t:0,tm:null,c:0,d:0,ok:0},
 s7:{a:0,b:0,c:0,d:0,p:0},s8:{a:0,b:0,c:0},s9:{a:0,b:0,c:0,ok:0},s10:{a:0,b:0,c:0}};
const beep=(f=520,d=.07)=>{try{const x=new(window.AudioContext||window.webkitAudioContext)(),o=x.createOscillator(),g=x.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+d)}catch(e){}};
const say=(t,tx)=>{S.m={t,tx};if(t=='bad'){S.err++;beep(180,.2)}else beep(620,.08);R()};
const win=(n,tx)=>{if(!S.done[n]){S.done[n]=1;S.log.push(`Stasiun ${n}: ${tx}`)}say('ok',`✅ Stasiun ${n} Selesai! ${tx}`)};
const go=n=>{if(S.s6.tm){clearInterval(S.s6.tm);S.s6.tm=null}S.st=n;S.m=null;beep(500,.05);R();window.scrollTo(0,0)};

function R(){
 const acc=Math.max(0,100-S.err*3);
 document.getElementById('hs').textContent=S.st==0?'Registrasi':(S.st==11?'Laporan':'Stasiun '+S.st+'/10');
 document.getElementById('ha').textContent='Akurasi '+acc+'%';
 document.getElementById('hb').style.width=(Math.min(S.st,10)*10)+'%';
 const app=document.getElementById('app'),nav=document.getElementById('nav');
 if(S.st==0){nav.style.display='none';app.innerHTML=`<div class="card"><h2 style="margin:0 0 6px;color:#38bdf8">🧬 PRAKTIKUM REKAYASA GENETIKA</h2><p style="color:#cbd5e1;font-size:.9rem">Simulasi 10 Stasiun Kerja: Pembuatan Bakteri <i>E. coli</i> Penghasil Insulin Manusia (Vektor pUC19-INS).</p>
 <label>Nama Lengkap / Anggota<input value="${S.u.n}" oninput="S.u.n=this.value;chk()"></label>
 <label>Kelas<input value="${S.u.k}" oninput="S.u.k=this.value;chk()"></label>
 <label>Kelompok<input value="${S.u.g}" oninput="S.u.g=this.value;chk()"></label>
 <button class="bp" id="b0" onclick="go(1)" disabled>MASUK KE LABORATORIUM →</button></div>`;chk();return}
 if(S.st==11){nav.style.display='none';app.innerHTML=`<div class="card"><h2 style="margin:0 0 8px;color:#22c55e">🏆 LAPORAN PRAKTIKUM SELESAI</h2>
 <table><tr><td>Nama</td><td><b>${S.u.n}</b></td></tr><tr><td>Kelas / Kelompok</td><td>${S.u.k} / ${S.u.g}</td></tr><tr><td>Konstruksi</td><td>pUC19-INS (2686 bp + 333 bp)</td></tr><tr><td>Akurasi Lab</td><td><b>${acc}%</b> (${S.err} kesalahan)</td></tr></table>
 <ul style="font-size:.85rem;color:#cbd5e1;padding-left:18px">${S.log.map(x=>`<li>${x}</li>`).join('')}</ul>
 <button class="bp np" onclick="window.print()">🖨️ CETAK / SIMPAN PDF</button><button class="bo np" style="text-align:center" onclick="location.reload()">🔄 ULANGI LAB</button></div>`;return}
 nav.style.display='flex';
 const fn=[null,st1,st2,st3,st4,st5,st6,st7,st8,st9,st10][S.st];
 app.innerHTML=fn()+(S.m?`<div class="msg ${S.m.t}">${S.m.tx}</div>`:'');
 nav.innerHTML=`<button class="bo" onclick="go(${S.st-1})">← Kembali</button><button class="bp" onclick="go(${S.st+1})" ${S.done[S.st]?'':'disabled'}>${S.st==10?'Laporan Akhir 🏆':'Lanjut →'}</button>`;
}
const chk=()=>{const b=document.getElementById('b0');if(b)b.disabled=!(S.u.n.trim()&&S.u.k.trim()&&S.u.g.trim())};

function st1(){const s=S.s1,it=[['a','🥼 Pakai Jas Lab'],['b','🧤 Sarung Tangan Nitril'],['c','💡 Matikan Lampu UV'],['d','💨 Nyalakan Blower Laminar'],['e','🧴 Semprot Alkohol 70%']];
 return `<div class="card"><div class="sop"><h3>Stasiun 1/10 — APD & Sterilisasi Biosafety Cabinet</h3><p>Aktifkan seluruh kelengkapan APD dan alat kabinet secara berurutan.</p></div>
 ${it.map(([k,t])=>`<button class="bo ${s[k]?'ok':''}" onclick="a1('${k}')">${s[k]?'✔ ':''}${t}</button>`).join('')}</div>`}
function a1(k){const s=S.s1;if(k=='d'&&!s.c)return say('bad','⚠️ Matikan lampu UV dulu sebelum menyalakan blower!');if(k=='e'&&(!s.b||!s.d))return say('bad','⚠️ Pakai sarung tangan & nyalakan blower dulu!');s[k]=1;if(s.a&&s.b&&s.c&&s.d&&s.e)win(1,'APD lengkap & meja kerja steril.');else R()}

function st2(){const s=S.s2;return `<div class="card"><div class="sop"><h3>Stasiun 2/10 — Isolasi Plasmid pUC19 (Miniprep)</h3><p>Ekstrak DNA plasmid murni dari kultur bakteri stok.</p></div>
 <div class="bench">⚙️ Microcentrifuge <div class="lcd">${s.a?'PELET MENGENDAP':'12.000 RPM'}</div>
 <button class="bo ${s.a?'ok':''}" onclick="S.s2.a=1;say('in','Sel mengendap di dasar tabung.')" ${s.a?'disabled':''}>1. Putar Centrifuge</button>
 <button class="bo ${s.b?'ok':''}" onclick="S.s2.b=1;say('in','Supernatan cair dibuang.')" ${!s.a||s.b?'disabled':''}>2. Buang Supernatan</button>
 <button class="bo ${s.c?'ok':''}" onclick="S.s2.c=1;say('in','Sel dilisiskan dengan Buffer P1, P2, N3.')" ${!s.b||s.c?'disabled':''}>3. Tambah Buffer Lisis & Netralisasi</button>
 <button class="bp" onclick="S.s2.d=1;win(2,'DNA plasmid pUC19 murni berhasil disaring.')" ${!s.c||s.d?'disabled':''}>4. Saring di Spin Column</button></div></div>`}

function st3(){const s=S.s3,r=[['buf','Buffer 10X',2],['puc','Plasmid pUC19',5],['ins','Gen Insulin',5],['eco','Enzim EcoRI',1],['hin','Enzim HindIII',1]],ok=r.every(x=>s[x[0]]==x[2]);
 return `<div class="card"><div class="sop"><h3>Stasiun 3/10 — Pemotongan Enzim Restriksi</h3><p>Resep: Buffer <b>2µL</b> + pUC19 <b>5µL</b> + Gen Insulin <b>5µL</b> + EcoRI <b>1µL</b> + HindIII <b>1µL</b>. Wajib ganti <b>Tip Steril</b> tiap reagen!</p></div>
 <div class="pip"><span>🔬 Dial: <b style="color:#38bdf8">${s.v} µL</b></span><div><button class="bo" style="width:auto;padding:4px 10px" onclick="S.s3.v=Math.max(1,S.s3.v-1);R()">−</button> <button class="bo" style="width:auto;padding:4px 10px" onclick="S.s3.v=Math.min(20,S.s3.v+1);R()">+</button></div></div>
 <div class="grid"><button class="bw" onclick="S.s3.t=1;S.s3.c=0;S.s3.lr='';R()">📦 Pasang Tip Baru</button><button class="bd" onclick="S.s3.t=0;S.s3.c=0;R()" ${s.t?'':'disabled'}>🗑️ Buang Tip (${s.t?(s.c?'Bekas':'Steril'):'Kosong'})</button></div>
 <div class="grid" style="margin-top:6px">${r.map(([k,n,q])=>`<button class="bo ${s[k]==q?'ok':''}" onclick="a3('${k}','${n}',${q})">${n} (${s[k]}/${q}µL)</button>`).join('')}</div>
 <div class="bench">🌡️ Water Bath <div class="lcd">37.0 °C</div><button class="bp" onclick="S.s3.ok=1;win(3,'Plasmid & gen insulin terpotong ujung lengket (sticky ends).')" ${ok&&!s.ok?'':'disabled'}>Inkubasi Pemotongan 37°C</button></div></div>`}
function a3(k,n,q){const s=S.s3;if(!s.t)return say('bad','⚠️ Pasang Tip Steril dulu!');if(s.c&&s.lr!=k)return say('bad','🚨 KONTAMINASI! Buang tip bekas dan pasang tip baru!');if(s.v!=q)return say('bad',`⚠️ Atur dial mikropipet ke ${q} µL untuk ${n}!`);s[k]=q;s.c=1;s.lr=k;say('in',`💧 ${q} µL ${n} masuk tabung. Buang tip sebelum ambil reagen lain!`)}

function st4(){const s=S.s4;return `<div class="card"><div class="sop"><h3>Stasiun 4/10 — Elektroforesis Gel & Ekstraksi Pita UV</h3><p>Isi sumuran gel (M, V, I), jalankan arus 100V, nyalakan UV, lalu potong pita gen insulin <b>333 bp</b>.</p></div>
 <div class="grid"><button class="bo ${s.m?'ok':''}" onclick="S.s4.m=1;R()">💧 Sumuran M (Marker)</button><button class="bo ${s.v?'ok':''}" onclick="S.s4.v=1;R()">💧 Sumuran V (Vektor)</button><button class="bo ${s.i?'ok':''}" onclick="S.s4.i=1;R()">💧 Sumuran I (Insulin)</button><button class="bo ${s.w?'ok':''}" onclick="if(!(s.m&&s.v&&s.i))return say('bad','Isi semua sumuran dulu!');S.s4.w=1;R()">🔌 Pasang Kabel 100V</button></div>
 <div class="bench" style="background:${s.uv?'#1e1b4b':'#042f2e'}"><div class="lcd">${s.r?(s.uv?'UV AKTIF: Pita 2686 bp & 333 bp berpendar':'GEL SELESAI BERLARI'):'TANGKI ELEKTROFORESIS'}</div>
 <button class="bp" onclick="S.s4.r=1;say('in','DNA bermigrasi ke kutub (+). Nyalakan UV!')" ${!s.w||s.r?'disabled':''}>⚡ Jalankan Gel 100V</button>
 <button class="bw" onclick="S.s4.uv=1;R()" ${!s.r||s.uv?'disabled':''}>🟣 Nyalakan Lampu UV</button>
 ${s.uv?`<div class="grid" style="margin-top:8px"><button class="bo" onclick="say('bad','Itu pita vektor 2686 bp! Potong pita gen insulin 333 bp.')">🔪 Potong Pita 2686 bp</button><button class="bp" onclick="S.s4.cut=1;win(4,'Pita gen insulin 333 bp berhasil diekstraksi dari gel.')" ${s.cut?'disabled':''}>🔪 Potong Pita 333 bp</button></div>`:''}</div></div>`}

function st5(){const s=S.s5;return `<div class="card"><div class="sop"><h3>Stasiun 5/10 — Ligasi DNA Rekombinan</h3><p>Sambungkan vektor pUC19 dan gen insulin 333 bp dengan T4 DNA Ligase.</p></div>
 <div class="grid"><button class="bo ${s.a?'ok':''}" onclick="S.s5.a=1;R()">+ Vektor pUC19</button><button class="bo ${s.b?'ok':''}" onclick="S.s5.b=1;R()">+ Gen Insulin 333 bp</button><button class="bo ${s.c?'ok':''}" onclick="S.s5.c=1;R()">+ T4 DNA Ligase</button><button class="bo ${s.d?'ok':''}" onclick="S.s5.d=1;R()">+ Ligase Buffer (ATP)</button></div>
 <div class="bench"><button class="bw" onclick="S.s5.v=1;say('in','Campuran homogen.')" ${!(s.a&&s.b&&s.c&&s.d)||s.v?'disabled':''}>🌀 Vortex Mixer</button>
 <button class="bp" onclick="S.s5.ok=1;win(5,'Plasmid rekombinan pUC19-INS terbentuk utuh.')" ${!s.v||s.ok?'disabled':''}>❄️ Inkubasi Ligasi 16°C</button></div></div>`}

function st6(){const s=S.s6;return `<div class="card"><div class="sop"><h3>Stasiun 6/10 — Transformasi Bakteri (Heat Shock 42°C)</h3><p>Campur plasmid ke <i>E. coli</i> kompeten di es → <b>Heat Shock 42°C tepat 40–50 detik</b> → Kembalikan ke es → Tambah media SOC.</p></div>
 <div class="bench"><button class="bo ${s.a?'ok':''}" onclick="S.s6.a=1;R()">1. Campur Plasmid + E. coli di Es (0°C)</button>
 <div class="lcd" style="color:#f59e0b">42.0 °C · Waktu: ${s.t} detik</div>
 ${!s.tm?`<button class="bw" onclick="hs1()" ${!s.a||s.t>=40?'disabled':''}>2. Mulai Heat Shock 42°C</button>`:`<button class="bd" onclick="hs2()">⏹️ ANGKAT TABUNG (Target 45 dtk)</button>`}
 <button class="bo ${s.c?'ok':''}" onclick="S.s6.c=1;R()" ${s.t<40||s.c?'disabled':''}>3. Dinginkan Kembali di Es (0°C)</button>
 <button class="bp" onclick="S.s6.d=1;win(6,'Plasmid pUC19-INS berhasil masuk ke sel E. coli.')" ${!s.c||s.d?'disabled':''}>4. Tambah Media SOC & Recovery 37°C</button></div></div>`}
function hs1(){S.s6.t=0;S.s6.tm=setInterval(()=>{S.s6.t+=5;beep(800,.03);if(S.s6.t>55){clearInterval(S.s6.tm);S.s6.tm=null;S.s6.t=0;say('bad','🔥 Terlalu lama (>55 dtk), sel bakteri pecah! Ulangi Heat Shock.')}else R()},500);R()}
function hs2(){clearInterval(S.s6.tm);S.s6.tm=null;if(S.s6.t<40){S.s6.t=0;return say('bad','❄️ Terlalu cepat (<40 dtk)! Ulangi hingga 40–50 detik.')}say('in',`⏱️ Tepat (${S.s6.t} detik)! Lanjut langkah 3.`)}

function st7(){const s=S.s7;return `<div class="card"><div class="sop"><h3>Stasiun 7/10 — Penanaman Cawan Petri (Spread Plate)</h3><p>Sterilkan L-Spreader lalu <b>usap lingkaran kuning cawan agar</b> hingga rata 100%.</p></div>
 <div class="grid"><button class="bo ${s.a?'ok':''}" onclick="S.s7.a=1;R()">1. Teteskan Bakteri</button><button class="bo ${s.b?'ok':''}" onclick="S.s7.b=1;R()" ${!s.a?'disabled':''}>2. Celup Alkohol</button><button class="bw" onclick="S.s7.c=1;R()" ${!s.b?'disabled':''}>3. Bakar di Bunsen</button><button class="bo ${s.d?'ok':''}" onclick="S.s7.d=1;R()" ${!s.c?'disabled':''}>4. Dinginkan Spreader</button></div>
 <div class="petri" onpointermove="sp7()" onpointerdown="sp7()"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#78350f;font-weight:800;text-align:center;padding:12px">${!s.d?'Selesaikan langkah 1–4':'Usap agar! '+Math.min(100,s.p)+'%'}</div></div></div>`}
function sp7(){const s=S.s7;if(!s.d||s.p>=100)return;s.p+=8;if(s.p>=100){s.p=100;win(7,'Bakteri tersebar merata di media LB + Ampisilin + X-Gal + IPTG.')}else R()}

function st8(){const s=S.s8,cs=[[30,35,0],[68,30,1],[50,55,0],[70,68,1],[32,70,1]];
 return `<div class="card"><div class="sop"><h3>Stasiun 8/10 — Blue-White Screening</h3><p>Bakar jarum ose, klik <b>KOLONI PUTIH</b> (rekombinan sukses), lalu inokulasi ke media cair.</p></div>
 <button class="bw" onclick="S.s8.a=1;say('in','Jarum ose steril. Pilih koloni putih!')" ${s.a?'disabled':''}>1. 🔥 Bakar Jarum Ose</button>
 <div class="petri">${cs.map(([x,y,w])=>`<div class="col" style="left:${x}%;top:${y}%;background:${w?'#fff':'#2563eb'}" onclick="pk8(${w})"></div>`).join('')}</div>
 <button class="bp" onclick="S.s8.c=1;win(8,'Koloni putih rekombinan diinokulasikan ke kultur cair LB+Amp.')" ${!s.b||s.c?'disabled':''}>3. Celup ke Media Cair LB + Ampisilin</button></div>`}
function pk8(w){if(!S.s8.a)return say('bad','Bakar jarum ose dulu!');if(!w)return say('bad','🔵 Koloni biru = plasmid kosong tanpa gen insulin. Pilih koloni PUTIH!');S.s8.b=1;say('in','⚪ Koloni putih terambil! Klik langkah 3.')}

function st9(){const s=S.s9;return `<div class="card"><div class="sop"><h3>Stasiun 9/10 — Konfirmasi PCR Koloni</h3><p>Verifikasi keberadaan sisipan gen insulin 333 bp menggunakan mesin Thermal Cycler.</p></div>
 <div class="bench"><button class="bo ${s.a?'ok':''}" onclick="S.s9.a=1;R()">+ Sampel Koloni Putih</button><button class="bo ${s.b?'ok':''}" onclick="S.s9.b=1;R()">+ Taq PCR Master Mix</button><button class="bo ${s.c?'ok':''}" onclick="S.s9.c=1;R()">+ Primer Spesifik Insulin</button>
 <div class="lcd">${s.ok?'30 SIKLUS SELESAI · PITA 333 BP VALID':'95°C → 55°C → 72°C'}</div>
 <button class="bp" onclick="S.s9.ok=1;win(9,'Amplikon PCR 333 bp terkonfirmasi valid.')" ${!(s.a&&s.b&&s.c)||s.ok?'disabled':''}>Jalankan 30 Siklus PCR</button></div></div>`}

function st10(){const s=S.s10;return `<div class="card"><div class="sop"><h3>Stasiun 10/10 — Induksi Ekspresi & Panen Insulin</h3><p>Aktifkan gen insulin dengan IPTG, pecahkan sel bakteri, dan murnikan protein insulin.</p></div>
 <div class="bench"><button class="bo ${s.a?'ok':''}" onclick="S.s10.a=1;say('in','IPTG mengaktifkan transkripsi & translasi hormon insulin.')" ${s.a?'disabled':''}>1. Tambahkan Penginduksi IPTG</button>
 <button class="bw" onclick="S.s10.b=1;say('in','Sel bakteri pecah melepaskan protein insulin.')" ${!s.a||s.b?'disabled':''}>2. Sonikasi (Pecah Sel Bakteri)</button>
 <button class="bp" onclick="S.s10.c=1;win(10,'Protein insulin manusia murni berhasil dipanen!')" ${!s.b||s.c?'disabled':''}>3. Kromatografi Afinitas (Panen Insulin)</button></div></div>`}
R();
</script></body></html>
